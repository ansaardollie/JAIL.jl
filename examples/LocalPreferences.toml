# Exemplar of every Preference JAIL reads. Copy the parts you need into the active project's
# LocalPreferences.toml. Values match the live file where set there, otherwise JAIL's defaults.
# Keys with no default are commented out. API keys never go here: `api_key_env` holds the
# *name* of the ENV var to read. Full reference: docs/src/guide/providers.md#Preferences-keys.

[JAIL]
# "provider/model-id" for new sessions and the "default" session at load. No default.
default_model = "openai/gpt-6-luna"

# false disables the REPL modes; read once when JAIL loads.
repl_modes = true

# Stream replies in the `}` chat mode.
stream = true

# When to ask [y/N] before a tool call, by the tool's security level:
# "all" (every call), "auto" (medium and high), "none" (high only), "yolo" (never).
tool_approval = "auto"

# Per-tool overrides of tool_approval: true never asks, false always asks. "global" tools by
# name; other groups as a table of tool names or a single true/false. Default: empty.
# tool_auto_approvals.get_weather = true
# tool_auto_approvals.files = true
# tool_auto_approvals.shell.run_shell = false

# Tool rounds per chat! call before further calls are answered "not run".
max_tool_rounds = 10

# Built-in tool groups or tool names registered when JAIL loads ("read", "inspect", "edit",
# "execute", "web", "interact", or names like "read_file"). Default: none.
# builtin_tools = ["read", "inspect"]

# Where the built-in execute_julia_code runs: "main" (Main) or "sandbox" (a module per session).
julia_code_module = "main"

# Paths, relative to the current directory, whose writes by built-in tools are always :high,
# besides LocalPreferences.toml, Project.toml, .git and storage_dir. Default: none.
# protected_paths = ["secrets", "docs/Project.toml"]

# ENV vars removed from built-in tools' child processes, besides names ending in _KEY,
# _CREDENTIALS or _CREDENTIAL. Default: none.
# scrub_env_vars = ["GITHUB_TOKEN"]

# Files and folders (relative to the current directory, or absolute) whose writes by the built-in
# edit tools are :low, unless protected. Default: none.
# path_allow_list = ["scratch", "docs/src"]

# Command prefixes for which run_shell is :low (commands with ; & | ` $ < > or line breaks are
# always :high). Default: none.
# command_allow_list = ["git status", "git diff"]

# Reply cap for chat! on every provider. Unset: Anthropic uses the model's max output, others none.
# max_tokens = 128000

# Reasoning effort when neither chat! nor the session sets one, sent as-is ("none", "minimal",
# "low", "medium", "high", "xhigh", "max"; providers take different subsets). Unset: not sent.
# thinking_effort = "medium"

# Sampling temperature when neither chat! nor the session sets one. Unset: not sent.
# temperature = 0.7

# Ask for reasoning summaries, show them while streaming, and save them under storage_dir/reasoning.
show_reasoning = false

# OpenAI, Google, and GoogleEnterprise (unless api = "generate_content") store replies and continue
# from them; false sends store = false and the full history every turn.
store_requests = true

# Replaces the built-in instructions for sessions created without `system`; "" gives none.
# system_prompt = "You are a helpful Julia assistant."

# Save sessions to disk from their first message on.
persist_sessions = true

# Folder for saved sessions, relative to the working directory when first saved.
storage_dir = ".jail"

    # Built-in providers: base_url and api_key_env override the defaults shown here.
    [JAIL.providers.openai]
    default_model = "gpt-6-luna"
    base_url = "https://api.openai.com/v1"
    api_key_env = "OPENAI_API_KEY"

    [JAIL.providers.anthropic]
    default_model = "claude-sonnet-5"
    base_url = "https://api.anthropic.com"
    api_key_env = "ANTHROPIC_API_KEY"

    [JAIL.providers.google]
    default_model = "gemini-3.1-flash-lite"
    base_url = "https://generativelanguage.googleapis.com"
    api_key_env = "GEMINI_API_KEY"

    # Vertex AI. project and location are required; there is no API key.
    [JAIL.providers.google_enterprise]
    default_model = "gemini-3.1-flash-lite"
    project = "dhd-prima"
    location = "global"
    # "interactions" (Gemini 3 only on Vertex) or "generate_content" (any Gemini model).
    api = "interactions"
    # Path to a service-account key file (never its contents). Unset: GOOGLE_APPLICATION_CREDENTIALS,
    # then Application Default Credentials, then the metadata server.
    # service_account_path = "/path/to/key.json"

    # OpenAI-compatible endpoint registered with register_provider!; the table name is the
    # provider name used in model strings ("lmstudio/llama-3.1-8b").
    [JAIL.providers.lmstudio]
    type = "openai_compatible"
    base_url = "http://localhost:1234/v1"
    # "responses" or "chat_completions".
    api = "responses"
    default_model = "llama-3.1-8b"
    # ENV var holding the key; omit for servers without auth.
    # api_key_env = "LMSTUDIO_API_KEY"
